name: Actualizar estadísticas del perfil

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v6

      - name: Generar tarjeta de estadísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=chacaejosue&show_icons=true&hide_border=true&locale=es&card_width=520&bg_color=0D1117&title_color=35D0C5&text_color=C9D1D9&icon_color=35D0C5
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar tarjeta de lenguajes
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=chacaejosue&layout=compact&langs_count=6&hide_border=true&locale=es&bg_color=0D1117&title_color=35D0C5&text_color=C9D1D9&icon_color=35D0C5
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar tarjetas si cambiaron
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            echo "Las estadísticas no cambiaron."
            exit 0
          fi
          git commit -m "chore(stats): actualizar estadísticas del perfil"
          git push