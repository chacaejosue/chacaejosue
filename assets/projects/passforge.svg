<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 495" width="100%" height="100%">
  <defs>
    <linearGradient id="pf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d16"/>
      <stop offset="100%" stop-color="#0c121e"/>
    </linearGradient>
    <linearGradient id="pf-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <pattern id="pf-cad" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.4"/>
    </pattern>

    <!-- Gradientes Oficiales del Favicon de PassForge -->
    <linearGradient id="shieldRim" x1="14" y1="12" x2="114" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5A5"/>
    </linearGradient>
    <linearGradient id="sparkGlow" x1="42" y1="40" x2="86" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#00E5BE"/>
      <stop offset="100%" stop-color="#0EA5A5"/>
    </linearGradient>
  </defs>

  <rect width="880" height="495" fill="url(#pf-bg)"/>
  <rect width="880" height="495" fill="url(#pf-cad)"/>

  <!-- Window Frame -->
  <rect x="25" y="20" width="830" height="455" rx="14" fill="#0b111a" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Window Header -->
  <path d="M 25 34 A 14 14 0 0 1 39 20 L 841 20 A 14 14 0 0 1 855 34 L 855 58 L 25 58 Z" fill="#111827"/>
  <line x1="25" y1="58" x2="855" y2="58" stroke="#1e293b" stroke-width="1"/>

  <circle cx="48" cy="39" r="5" fill="#f43f5e" fill-opacity="0.9"/>
  <circle cx="66" cy="39" r="5" fill="#fbbf24" fill-opacity="0.9"/>
  <circle cx="84" cy="39" r="5" fill="#10b981" fill-opacity="0.9"/>

  <!-- Address URL limpia (sin favicon comprimido) -->
  <text x="105" y="43" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">passforge.local/csprng/vault</text>

  <rect x="650" y="28" width="185" height="22" rx="11" fill="#064e3b" fill-opacity="0.35" stroke="#059669" stroke-width="0.8"/>
  <circle cx="664" cy="39" r="3.5" fill="#34d399"/>
  <text x="675" y="43" fill="#34d399" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Motor: PEP 506 Activo</text>

  <!-- Panel Header with Official PassForge Shield Logo (100% Transparente sin marco cuadrado) -->
  <g transform="translate(50, 75)">
    <!-- Official PassForge Scaled Favicon Geometry -->
    <g transform="translate(0, 0) scale(0.28)">
      <!-- Faceta Izquierda de la Placa -->
      <path d="M 64 22 L 42 12 L 14 28 L 14 68 C 14 96 38 116 64 122 Z" fill="#0B132B"/>
      <!-- Faceta Derecha de la Placa -->
      <path d="M 64 22 L 86 12 L 114 28 L 114 68 C 114 96 90 116 64 122 Z" fill="#1E293B"/>
      <!-- Borde de Armadura Esculpido -->
      <path d="M 64 22 L 86 12 L 114 28 L 114 68 C 114 96 90 116 64 122 C 38 116 14 96 14 68 L 14 28 L 42 12 Z" fill="none" stroke="url(#shieldRim)" stroke-width="4.5" stroke-linejoin="round"/>
      <!-- Costura Central -->
      <line x1="64" y1="23" x2="64" y2="120" stroke="url(#shieldRim)" stroke-width="2" stroke-opacity="0.35"/>
      <!-- Chispa de la Forja / Núcleo de Entropía -->
      <path d="M 64 40 Q 64 62 86 62 Q 64 62 64 84 Q 64 62 42 62 Q 64 62 64 40 Z" fill="url(#sparkGlow)"/>
      <circle cx="64" cy="62" r="3.5" fill="#FFFFFF"/>
    </g>

    <text x="44" y="16" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">PassForge Security Core</text>
    <text x="44" y="30" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">CSPRNG OS Kernel • Zero-Knowledge (Sin logs)</text>

    <rect x="630" y="6" width="150" height="22" rx="5" fill="#14b8a6" fill-opacity="0.15" stroke="#14b8a6" stroke-width="0.8"/>
    <text x="705" y="21" fill="#2dd4bf" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">secrets /dev/urandom</text>
  </g>

  <!-- 3 Crypto Metrics -->
  <g transform="translate(50, 125)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="248" height="68" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="20" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.5">ENTROPÍA CSPRNG</text>
    <text x="14" y="44" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="17" font-weight="700">100 bits</text>
    <text x="14" y="59" fill="#34d399" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600">Nivel militar (Máximo)</text>

    <!-- Metric 2 -->
    <rect x="266" y="0" width="248" height="68" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.35"/>
    <text x="280" y="20" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.5">LATENCIA API</text>
    <text x="280" y="44" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="17" font-weight="700">&lt; 15 ms</text>
    <text x="280" y="59" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9.5">Flask multithread</text>

    <!-- Metric 3 -->
    <rect x="532" y="0" width="248" height="68" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="546" y="20" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.5">STORAGE DE CLAVES</text>
    <text x="546" y="44" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="17" font-weight="700">0 bytes</text>
    <text x="546" y="59" fill="#2dd4bf" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600">Sin persistencia en disco</text>
  </g>

  <!-- Vault Activity & Security Features -->
  <g transform="translate(50, 208)">
    <rect x="0" y="0" width="780" height="248" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    
    <text x="18" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Protocolos criptográficos aplicados</text>
    <text x="760" y="26" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10" font-weight="600" text-anchor="end">Auditoría OWASP</text>

    <!-- Row 1: Entropy meter visual -->
    <rect x="18" y="40" width="744" height="60" rx="7" fill="#0b111e" stroke="#1e293b" stroke-width="0.8"/>
    <text x="32" y="62" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Generación CSPRNG de alta entropía (16 caracteres)</text>
    <text x="746" y="62" fill="#2dd4bf" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" text-anchor="end">1.4 x 10^30 combinaciones</text>
    <rect x="32" y="74" width="714" height="6" rx="3" fill="#1e293b"/>
    <rect x="32" y="74" width="714" height="6" rx="3" fill="url(#pf-bar)"/>

    <!-- Row 2: HTTP Security Headers -->
    <rect x="18" y="110" width="744" height="52" rx="7" fill="#0b111e" stroke="#1e293b" stroke-width="0.8"/>
    <rect x="30" y="122" width="28" height="28" rx="6" fill="#14b8a6" fill-opacity="0.15"/>
    <path d="M 44 128 L 44 142 M 37 135 L 51 135" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round"/>
    <text x="68" y="133" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Cabeceras de protección anti-fuga</text>
    <text x="68" y="146" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">Cache-Control: no-store, no-cache, must-revalidate • Strict CSP</text>
    <text x="746" y="140" fill="#34d399" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="end">✓ Activo</text>

    <!-- Row 3: Offline Fallback -->
    <rect x="18" y="172" width="744" height="56" rx="7" fill="#090d16" stroke="#1e293b" stroke-width="0.8"/>
    <text x="32" y="196" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">Arquitectura Híbrida: Fallback Offline en Astro con Web Crypto</text>
    <text x="32" y="214" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">Si la API Flask entra en cooldown de hosting, el motor cliente asume el 100% de la carga criptográfica</text>
  </g>
</svg>